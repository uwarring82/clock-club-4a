name: Record workshop minutes
on:
  push:
    branches: [feature/workshop-minutes]
    paths: [.github/workflows/workshop-record.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify.cjs
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Record missing minutes
        env:
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
        run: python3 scripts/record_workshop.py
      - name: Build and save verified edition
        run: |
          python3 scripts/export_offline.py
          test "$(find docs/audio -name '*.mp3' | wc -l)" -eq 723
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audio docs/Clock-Club-4a.html
          git commit -m "Include all 720 minute readings plus noon and midnight"
          git push origin HEAD:feature/workshop-minutes
