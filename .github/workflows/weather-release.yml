name: Verify workshop weather
on:
  push:
    branches: [feature/workshop-weather]
    paths: [.github/workflows/weather-release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify.cjs && python3 scripts/export_offline.py
      - name: Test weather opt-in and hourly sky online and offline
        run: |
          npm install --prefix "$RUNNER_TEMP/clock-test" playwright-core --silent
          export NODE_PATH="$RUNNER_TEMP/clock-test/node_modules" CHROME="$(command -v google-chrome)"
          python3 -m http.server 8181 --directory docs >/tmp/clock-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright-core'), assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME,args:['--no-sandbox']});
            try{
              for(const standalone of [false,true]){
                const page=await browser.newPage({viewport:{width:390,height:844}});
                await page.clock.setFixedTime(new Date('2026-11-26T12:00:00Z'));
                let calls=0,errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.route('https://api.open-meteo.com/**',async route=>{
                  calls++;
                  if(calls>1)return route.abort();
                  const start=Date.parse('2026-11-25T23:00:00Z')/1000;
                  const hourly={time:[start,start+12*3600],temperature_2m:[-2,6],weather_code:[71,61],cloud_cover:[94,85]};
                  await route.fulfill({json:{hourly},headers:{'Access-Control-Allow-Origin':'*'}});
                });
                await page.goto(standalone?'file://'+process.cwd()+'/docs/Clock-Club-4a.html#werkstatt':'http://localhost:8181/#werkstatt');
                await page.getByRole('button',{name:'Ort übernehmen'}).click();
                await page.locator('.work-tools summary').click();
                await page.locator('[data-action="midnight"]').click();
                assert.equal(calls,0);
                await page.locator('#weatherToggle').check();
                await page.waitForSelector('#weatherLayer[data-effect="snow"]',{state:'attached'});
                assert.match(await page.locator('#weatherNote').innerText(),/-2 °C/);
                await page.locator('[data-action="noon"]').click();
                await page.waitForSelector('#weatherLayer[data-effect="rain"]',{state:'attached'});
                assert.equal(calls,1);
                assert.ok(await page.locator('#weatherCredit a').isVisible());
                await page.locator('#weatherRetry').click();
                await page.waitForFunction(()=>document.querySelector('#weatherNote').textContent.includes('Stand'));
                await page.locator('[data-action="plus"]').click();
                assert.match(await page.locator('#weatherNote').innerText(),/keine Vorhersage|nicht verfügbar/);
                assert.equal(await page.locator('#weatherCredit').isVisible(),false);
                await page.locator('.work-tools summary').click();
                await page.locator('.work-location').click();
                await page.selectOption('#skyCity',{label:'London'});
                await page.getByRole('button',{name:'Ort übernehmen'}).click();
                await page.locator('.work-tools summary').click();
                assert.equal(await page.locator('#weatherToggle').isChecked(),false);
                await page.locator('#weatherToggle').check();
                await page.waitForFunction(()=>document.querySelector('#weatherNote').textContent.includes('nicht verfügbar'));
                assert.ok(await page.locator('.work-dial').isVisible());
                await page.locator('#weatherToggle').uncheck();
                assert.deepEqual(errors,[]);
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Commit verified offline edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Clock-Club-4a.html
          git commit -m "Embed optional weather in the offline edition"
          git push origin HEAD:feature/workshop-weather
