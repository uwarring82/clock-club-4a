name: Record Marian's welcome
on:
  push:
    branches: [audio/hands-on-welcome]
    paths: [.github/workflows/record-welcome.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and save greeting
        run: |
          python3 scripts/export_offline.py
          node scripts/verify.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Clock-Club-4a.html docs/audio/welcome.mp3
          git commit -m "Embed the recorded Marian greeting online and offline"
          git push origin HEAD:audio/hands-on-welcome
