name: Verify daylight workshop
on:
  push:
    branches: [feature/daylight-dial]
    paths: [.github/workflows/daylight-workshop.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify.cjs && python3 scripts/export_offline.py
      - name: Verify live and offline controls in mobile and desktop Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/clock-test" playwright-core --silent
          python3 -m http.server 8181 --directory docs > /tmp/clock-http.log 2>&1 &
          export NODE_PATH="$RUNNER_TEMP/clock-test/node_modules"
          export CHROME="$(command -v google-chrome)"
          node <<'JS'
          const {chromium}=require('playwright-core'), assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME,args:['--no-sandbox']});
            try {
              for(const [width,height,file] of [[390,844,''],[844,390,'Clock-Club-4a.html'],[1200,800,'']]){
                const page=await browser.newPage({viewport:{width,height},hasTouch:true});
                await page.goto('http://localhost:8181/'+file+'#werkstatt');
                assert.equal(await page.locator('.site-header').isVisible(),false);
                assert.equal(await page.locator('.work-tools').getAttribute('open'),null);
                await page.locator('summary').click();
                await page.locator('[data-action="midnight"]').click();
                await page.locator('.work-tools summary').click();
                const dial=page.locator('.work-dial'), box=await dial.boundingBox();
                const point=k=>({x:box.x+box.width*(0.5+81/220*Math.sin(k*Math.PI/30)),y:box.y+box.height*(0.5-81/220*Math.cos(k*Math.PI/30))});
                const pos=point(0);
                await page.mouse.move(pos.x,pos.y);await page.mouse.down();
                for(let k=1;k<=65;k++){const p=point(k);await page.mouse.move(p.x,p.y);}
                assert.match(await page.locator('#workReadings').innerText(),/01:05 Uhr/);
                assert.match(await page.locator('#workPhrase').innerText(),/five past one/);
                await page.mouse.up();
                assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
                await page.locator('.work-exit').click();
                assert.ok(await page.locator('.site-header').isVisible());
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save tested offline edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Clock-Club-4a.html
          git commit -m "Rebuild standalone daylight workshop"
          git push origin HEAD:feature/daylight-dial
