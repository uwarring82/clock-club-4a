name: Record Marian's welcome
on:
  push:
    branches: [audio/welcome-guide]
    paths: [.github/workflows/record-welcome.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Record and normalize welcome
        env:
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
        shell: python
        run: |
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from generate_marian import synthesize
          from prepare_audio import normalize
          source = Path(os.environ["RUNNER_TEMP"]) / "welcome.wav"
          app = Path("docs/app.js").read_text()
          paragraphs = json.loads(re.search(r"const welcomeParagraphs = (\[.*?\]);", app, re.S)[1])
          source.write_bytes(synthesize("\n\n".join(paragraphs), os.environ["SPEECHIFY_API_KEY"]))
          normalize(source, Path("docs/audio"), 48000, "96k")
      - name: Build, test and save greeting
        run: |
          python3 scripts/export_offline.py
          node scripts/verify.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Clock-Club-4a.html docs/audio/welcome.mp3
          git commit -m "Embed the recorded Marian greeting online and offline"
          git push origin HEAD:audio/welcome-guide
